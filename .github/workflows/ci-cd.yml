name: CinemaSeat CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cinemaseat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: 1. Install Node Dependencies
        run: npm ci

      - name: 2. Build Frontend & Bundled Server
        run: npm run build

      - name: 3. Build Java Backend
        run: |
          if [ -f "backend/pom.xml" ]; then
            cd backend && mvn clean package -DskipTests=false
          fi

      - name: 4. Start Server & Run Local Test Suite (23 Scenarios incl. 100 Concurrent Atomicity)
        env:
          NODE_ENV: production
          PORT: 3000
          HOLD_TTL_SECONDS: 120
        run: |
          npm start &
          SERVER_PID=$!
          echo "Waiting for CinemaSeat server to spin up on port 3000..."
          sleep 3
          npm test
          kill $SERVER_PID

      - name: 5. Build Docker Image (Root Full-Stack Container)
        run: docker build -t cinemaseat-app:latest -f dockerfiles/frontend.prod.Dockerfile .

      - name: 6. Build Backend Docker Image (Spring Boot Service Container)
        run: docker build -t cinemaseat-backend:latest -f dockerfiles/backend.prod.Dockerfile .
